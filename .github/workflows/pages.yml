name: Vista previa en GitHub Pages

# Construye la web como estática y la deja en la rama gh-pages.
# En GitHub: Settings > Pages > Deploy from a branch > gh-pages / (root).
# Sale en https://dnsue01.github.io/ethanbarberia/ con el catálogo de muestra.

on:
  push:
    branches: [pages-preview]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build estático
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITIO: https://dnsue01.github.io

      - name: Publicar en la rama gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Vista previa: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
